[workspace]
resolver = "3"
members = ["crates/*", "sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/thewillyhuman/tessera"

[workspace.dependencies]
# Internal crates. Dependencies point downward only (spec section 18.1).
tessera-types = { path = "crates/tessera-types" }
tessera-object = { path = "crates/tessera-object" }
tessera-commit = { path = "crates/tessera-commit" }
tessera-catalog = { path = "crates/tessera-catalog" }
tessera-format = { path = "crates/tessera-format" }
tessera-wal = { path = "crates/tessera-wal" }
tessera-manifest = { path = "crates/tessera-manifest" }
tessera-ingest = { path = "crates/tessera-ingest" }
tessera-ir = { path = "crates/tessera-ir" }
tessera-kernels = { path = "crates/tessera-kernels" }
tessera-opt = { path = "crates/tessera-opt" }
tessera-exec = { path = "crates/tessera-exec" }
tessera-server = { path = "crates/tessera-server" }

[workspace.lints.rust]
# RS-1: `unsafe` is confined to named modules with documented invariants.
# `deny` (not `forbid`) so such a module can opt in with an `allow` and a
# SAFETY comment.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A type named after its module (`object::ObjectStore`) is the idiom in this
# code base and reads well at the call site.
module_name_repetitions = "allow"

[profile.release]
debug = 1
