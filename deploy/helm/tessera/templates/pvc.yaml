{{- if not .Values.rootPool.url }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tessera.fullname" . }}-root-pool
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteMany]
  {{- with .Values.rootPool.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rootPool.size }}
{{- end }}
