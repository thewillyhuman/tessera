{{- $root := . -}}
{{- range $name, $group := .Values.groups }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tessera.fullname" $root }}-{{ $name }}
  labels:
    {{- include "tessera.labels" $root | nindent 4 }}
    tessera.dev/group: {{ $name | quote }}
spec:
  replicas: {{ $group.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tessera.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      tessera.dev/group: {{ $name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tessera.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        tessera.dev/group: {{ $name | quote }}
        {{- if or (has "query" $group.roles) (has "ingest" $group.roles) }}
        tessera.dev/serves: "true"
        {{- end }}
    spec:
      {{- with $root.Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: tessera
          image: {{ include "tessera.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - run
            {{- if $root.Values.rootPool.url }}
            - --root-pool={{ $root.Values.rootPool.url }}
            {{- else }}
            - --data-dir=/var/lib/tessera
            {{- end }}
            - --listen=0.0.0.0:8080
            - --pg-listen=0.0.0.0:5432
            - --roles={{ join "," $group.roles }}
            - --advertise=http://$(POD_IP):8080
            {{- if not $root.Values.allowAnonymous }}
            - --no-anonymous
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- range $key, $value := $root.Values.rootPool.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with $root.Values.rootPool.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: pg
              containerPort: 5432
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          # A pod told to stop keeps serving for a moment, until the
          # service has stopped sending to it, and only then gets the
          # signal: a rolling upgrade refuses no request.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $root.Values.drainSeconds }}
          # Nothing is written outside the volumes: queries spill
          # under /tmp, and what is durable goes to the root pool.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            {{- if not $root.Values.rootPool.url }}
            - name: root-pool
              mountPath: /var/lib/tessera
            {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
      volumes:
        - name: scratch
          emptyDir: {}
        {{- if not $root.Values.rootPool.url }}
        - name: root-pool
          persistentVolumeClaim:
            claimName: {{ include "tessera.fullname" $root }}-root-pool
        {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
