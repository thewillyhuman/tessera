# Tessera on Kubernetes. Every node is the same image with different
# roles (OP-11); nodes find each other through the root pool, which is
# a bucket or, without one, a ReadWriteMany volume.

image:
  repository: ghcr.io/thewillyhuman/tessera
  tag: ""        # the chart's appVersion when empty
  pullPolicy: IfNotPresent

# Node groups: each is a Deployment of nodes running the listed roles.
groups:
  front:
    replicas: 2
    roles: [ingest, query]
  back:
    replicas: 1
    roles: [compact, eval]

# Requests without an API key are refused unless this is true. Issue
# keys with POST /api/v1/tenants/{name}/keys from a _system admin key;
# bootstrap the first one with anonymous access on, then turn it off.
allowAnonymous: false

# A secret whose entry `secret` the nodes present to each other on
# the routes between them (SE-3), so that nothing else can use those
# routes. Empty, they are open to whatever reaches a pod's port:
# name one wherever the pods' network is shared.
#   kubectl create secret generic tessera-cluster \
#       --from-literal=secret="$(openssl rand -hex 32)"
clusterSecret: ""

# A secret whose entry `keyring` holds the tenants' keys, one
# `name = <64 hex digits>` per line (SE-2): a tenant whose
# `encryption_key` setting names one has its data sealed under it.
# Every node gets the same file, read-only. Empty, no tenant can be
# given a key. Keep every key a tenant ever used in it for as long as
# objects sealed under that key remain.
#   kubectl create secret generic tessera-keyring \
#       --from-literal=keyring="k1 = $(openssl rand -hex 32)"
keyringSecret: ""

rootPool:
  # The root pool as a bucket, or a prefix in one: s3://<bucket> or
  # s3://<bucket>/<prefix>, in a store that refuses a PUT with
  # If-None-Match: * on a key that exists (Amazon S3, MinIO, Ceph, R2).
  # Empty, the root pool is the volume below.
  url: ""
  # The environment of the store's client, as the AWS tools read it:
  # AWS_REGION, and for a store other than Amazon's AWS_ENDPOINT_URL,
  # with AWS_ALLOW_HTTP: "true" when it speaks plain HTTP.
  env: {}
  # A secret whose entries become environment variables as well, for
  # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Empty where the pods
  # get their credentials from the service account below.
  credentialsSecret: ""
  # The volume used when no bucket is named.
  storageClassName: ""      # must support ReadWriteMany
  size: 100Gi

# How a node with the ingest role writes. Each writer is a log of its
# own, appended to by one task: a node stores one segment at a time
# per writer, so its writers are how many of its cores ingest uses and
# how many writes to the store it has in flight. One suits a node of a
# core or two; give a larger node as many as the cores it may spend on
# ingest.
ingest:
  writers: 1

# The cache of object reads on each pod's local disk, used when the
# root pool is a bucket: the most bytes it keeps of data files, their
# indexes and writer-log entries. Zero turns it off.
cache:
  bytes: 8589934592

# The service account the pods run as, for clusters that hand a
# bucket's credentials to a service account; the namespace's default
# when empty.
serviceAccountName: ""

# How long a pod that is being replaced keeps serving before it is
# told to stop, the time the service takes to stop sending to it.
drainSeconds: 5

service:
  type: ClusterIP
  httpPort: 8080
  pgPort: 5432

# A Grafana that shows the cluster itself. Its data sources read the
# _system tenant through this release's service: the nodes' metrics
# over the Prometheus API, their logs over the Loki API and the usage
# they record over the PostgreSQL protocol. Its dashboards, which
# cannot be edited in place, show the state of the nodes, what each
# tenant sends, stores and reads, and what that costs at the cluster's
# prices (the settings price.*; a cost is zero until they are set).
grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: "13.2.0"
    pullPolicy: IfNotPresent
  # A secret whose entry `api-key` is an API key of the _system tenant
  # with the reader role, which the data sources present. Required
  # unless allowAnonymous is true.
  #   kubectl create secret generic tessera-grafana --from-literal=api-key=tsk_...
  apiKeySecret: ""
  # A secret whose entry `admin-password` is the password of Grafana's
  # user `admin`. Empty, nobody can sign in, and whoever reaches the
  # service sees the dashboards read-only.
  adminPasswordSecret: ""
  service:
    type: ClusterIP
    port: 3000
  resources: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
