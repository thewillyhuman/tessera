# An S3-compatible store for the smoke test of the chart: one MinIO
# with its data in the pod, the bucket the test uses, and the secret
# the chart reads the credentials from. Not for anything that matters.
apiVersion: v1
kind: Secret
metadata:
  name: tessera-bucket
stringData:
  AWS_ACCESS_KEY_ID: tessera
  AWS_SECRET_ACCESS_KEY: tessera-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: bitnamilegacy/minio:2025.5.24-debian-12-r5
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tessera-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tessera-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: MINIO_DEFAULT_BUCKETS
              value: tessera
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
