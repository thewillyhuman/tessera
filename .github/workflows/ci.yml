name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain the repository pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  simulation:
    name: long simulation run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain the repository pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p tessera-sim -- --seeds 1000 --nodes 5 --steps 40 --fail-before 0.15 --fail-after 0.15

  # Builds the image, proves it on a cluster and, on main, publishes it
  # under its commit: the image a release of that commit is made of
  # (release.yml builds nothing), and one to run before any release
  # with `--set image.tag=sha-<commit>`.
  image:
    name: image and chart on a kind cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: helm lint deploy/helm/tessera
      - uses: docker/setup-buildx-action@v3
      # Two builds, so that the cache between runs holds the stage of
      # the dependencies and not Tessera's own build on top of it, a
      # layer of gigabytes that the next commit cannot use.
      - name: build the dependencies, or take them from the cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build the image on them
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tessera:ci
          cache-from: type=gha
      - run: IMAGE=tessera:ci SKIP_BUILD=1 deploy/kind/smoke.sh
      - name: publish the image under its commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag tessera:ci "$image"
          docker push "$image"

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  s3:
    name: store contract and a node against an s3 bucket
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnamilegacy/minio:2025.5.24-debian-12-r5
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: tessera
          MINIO_ROOT_PASSWORD: tessera-secret
          MINIO_DEFAULT_BUCKETS: tessera-test
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain the repository pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wait for minio
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "minio did not become ready" >&2
          exit 1
      - run: |
          cargo test -p tessera-object remote -- --nocapture
          cargo test -p tessera-node --test node a_node_on_a_bucket -- --nocapture
        env:
          TESSERA_S3_TEST_URL: s3://tessera-test/ci
          AWS_ACCESS_KEY_ID: tessera
          AWS_SECRET_ACCESS_KEY: tessera-secret
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"

  logql:
    name: logql differential suite against loki
    runs-on: ubuntu-latest
    services:
      loki:
        image: grafana/loki:3.3.2
        ports:
          - 3100:3100
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain the repository pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wait for loki
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -s http://127.0.0.1:3100/ready)" = "ready" ]; then exit 0; fi
            sleep 1
          done
          echo "loki did not become ready" >&2
          exit 1
      - run: cargo test -p tessera-compat-logql -- --nocapture
        env:
          TESSERA_LOKI_URL: http://127.0.0.1:3100

  traceql:
    name: traceql differential suite against tempo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain the repository pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: start tempo
        run: |
          docker run -d --name tempo -p 3200:3200 -p 4318:4318 \
            -v "$PWD/compat/traceql/tempo.yaml:/etc/tempo.yaml:ro" \
            grafana/tempo:2.7.1 -config.file=/etc/tempo.yaml
          for i in $(seq 1 120); do
            if [ "$(curl -s http://127.0.0.1:3200/ready)" = "ready" ]; then exit 0; fi
            sleep 1
          done
          docker logs tempo >&2
          echo "tempo did not become ready" >&2
          exit 1
      - run: cargo test -p tessera-compat-traceql -- --nocapture
        env:
          TESSERA_TEMPO_URL: http://127.0.0.1:3200
          TESSERA_TEMPO_OTLP_URL: http://127.0.0.1:4318

  promql:
    name: promql differential suite against prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the toolchain the repository pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: start prometheus
        run: |
          docker run -d --name prometheus -p 9090:9090 \
            -v "$PWD/compat/promql/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.15.0 \
            --config.file=/etc/prometheus/prometheus.yml \
            --web.enable-remote-write-receiver
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:9090/-/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs prometheus >&2
          echo "prometheus did not become ready" >&2
          exit 1
      - run: cargo test -p tessera-compat-promql -- --nocapture
        env:
          TESSERA_PROMETHEUS_URL: http://127.0.0.1:9090
