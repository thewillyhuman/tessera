name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  simulation:
    name: long simulation run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p tessera-sim -- --seeds 1000 --nodes 5 --steps 40 --fail-before 0.15 --fail-after 0.15

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  logql:
    name: logql differential suite against loki
    runs-on: ubuntu-latest
    services:
      loki:
        image: grafana/loki:3.3.2
        ports:
          - 3100:3100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wait for loki
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -s http://127.0.0.1:3100/ready)" = "ready" ]; then exit 0; fi
            sleep 1
          done
          echo "loki did not become ready" >&2
          exit 1
      - run: cargo test -p tessera-compat-logql -- --nocapture
        env:
          TESSERA_LOKI_URL: http://127.0.0.1:3100
