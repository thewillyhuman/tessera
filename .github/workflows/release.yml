name: release

# A tag `v<version>` publishes that version: the container image and
# the Helm chart, both to the repository's registry, so that the
# chart's default image is one that exists. The tag must name the
# version the workspace and the chart carry.
#
# Nothing is built here. The image is the one CI built from the tagged
# commit, proved on a kind cluster and pushed under the commit
# (ci.yml), published again under the version; a release therefore
# needs CI to have passed on that commit, and waits for it when the
# tag is pushed together with the commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: image and chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check the tag against the versions in the tree
        run: |
          version="${GITHUB_REF_NAME#v}"
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          chart=$(sed -n 's/^version: //p' deploy/helm/tessera/Chart.yaml)
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/tessera/Chart.yaml)
          for found in "$workspace" "$chart" "$app"; do
            if [ "$found" != "$version" ]; then
              echo "the tag says $version; the tree says $workspace (workspace), $chart (chart), $app (chart appVersion)" >&2
              exit 1
            fi
          done
          {
            echo "VERSION=$version"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}"
            echo "CHARTS=oci://$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_ENV"
      - name: wait for ci to have passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every fifteen seconds for half an hour; three minutes for a
          # run to appear at all, which none does for a commit that was
          # never the head of a push to main.
          for attempt in $(seq 1 120); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$COMMIT" \
                --event push --limit 1 --json status,conclusion,url \
                --jq '.[0] // empty | "\(.status) \(.conclusion) \(.url)"')
            case "$run" in
              "completed success "*) echo "ci passed: $run"; exit 0 ;;
              "completed "*) echo "ci did not pass on $COMMIT: $run" >&2; exit 1 ;;
              "") if [ "$attempt" -gt 12 ]; then
                    echo "ci never ran on $COMMIT: tag a commit that was pushed to main as its head" >&2
                    exit 1
                  fi ;;
            esac
            sleep 15
          done
          echo "ci did not finish on $COMMIT within half an hour" >&2
          exit 1
      - name: publish the image ci proved under the version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:sha-$COMMIT"
      - name: push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package deploy/helm/tessera --destination "$RUNNER_TEMP"
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/tessera-$VERSION.tgz" "$CHARTS"
