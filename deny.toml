# RS-6 / LI-5: dependencies must be under permissive licenses so that the
# project's own license can be chosen freely. Checked in CI with cargo-deny.

[graph]
all-features = true

[licenses]
# Workspace crates carry LicenseRef-Tessera-Pending until the license is
# final (LI-4); they are not published and are not checked.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The Mozilla root certificate store that the HTTP client ships, under
# the Community Data License Agreement, permissive: data, not code, and
# it carries no obligation on the project's own license.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# pgwire's TLS support and the server's client-certificate authentication
# read certificates through x509-certificate, which is MPL-2.0: a file-level copyleft that binds only changes to that
# crate, which Tessera does not make.
[[licenses.exceptions]]
crate = "x509-certificate"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
