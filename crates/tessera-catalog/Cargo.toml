[package]
name = "tessera-catalog"
description = "Tessera cluster catalog: tenants, pools, slot counts and cluster settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-commit.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
