[package]
name = "tessera-iceberg"
description = "Tessera open-format export: Apache Iceberg metadata over a dataset's adopted Parquet files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-manifest.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
apache-avro = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
