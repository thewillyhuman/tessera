[package]
name = "tessera-ir"
description = "Tessera plan representation: expressions, plan nodes, types, function registry and the front-end contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
arrow-schema = { version = "60", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
