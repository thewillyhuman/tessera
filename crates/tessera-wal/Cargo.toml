[package]
name = "tessera-wal"
description = "Tessera writer logs: segments, flush records, seal and recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-format.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false, features = ["ipc", "ipc_compression"] }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
