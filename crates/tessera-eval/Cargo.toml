[package]
name = "tessera-eval"
description = "Tessera continuous queries and alerting: rules, the alert lifecycle, rule-group state logs, evaluation and notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-catalog.workspace = true
tessera-commit.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
