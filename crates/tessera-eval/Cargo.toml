[package]
name = "tessera-eval"
description = "Tessera continuous queries and alerting: rules, the alert lifecycle, rule-group state logs, evaluation and notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-catalog.workspace = true
tessera-commit.workspace = true
tessera-exec.workspace = true
tessera-ir.workspace = true
tessera-logql.workspace = true
tessera-object.workspace = true
tessera-opt.workspace = true
tessera-promql.workspace = true
tessera-sql.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tessera-format.workspace = true
tessera-manifest.workspace = true
tessera-wal.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
