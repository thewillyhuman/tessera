[package]
name = "tessera-eval"
description = "Tessera continuous queries and alerting: rules, the alert lifecycle, rule-group state logs, evaluation and notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-catalog.workspace = true
tessera-commit.workspace = true
tessera-exec.workspace = true
tessera-ir.workspace = true
tessera-kernels.workspace = true
tessera-logql.workspace = true
tessera-manifest.workspace = true
tessera-object.workspace = true
tessera-opt.workspace = true
tessera-promql.workspace = true
tessera-sql.workspace = true
tessera-types.workspace = true
tessera-wal.workspace = true

arrow = { version = "60", default-features = false }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
ureq = { version = "3", default-features = false }
url = "2"

[dev-dependencies]
tessera-format.workspace = true
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
