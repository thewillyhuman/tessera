[package]
name = "tessera-exec"
description = "Tessera execution: push-based operators, pipelines, the CPU scheduler, scans and memory accounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-format.workspace = true
tessera-ir.workspace = true
tessera-kernels.workspace = true
tessera-manifest.workspace = true
tessera-object.workspace = true
tessera-opt.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
arrow-ipc = "60"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tessera-sql.workspace = true
tessera-compact.workspace = true
tessera-wal.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
