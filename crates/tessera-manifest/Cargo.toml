[package]
name = "tessera-manifest"
description = "Tessera partitions: manifest logs, writer registry, intake and the consistent view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-commit.workspace = true
tessera-format.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true
tessera-wal.workspace = true

arrow = { version = "60", default-features = false }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
