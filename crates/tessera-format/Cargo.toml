[package]
name = "tessera-format"
description = "Tessera data file format: the FileFormat trait and its Parquet implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-object.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
async-trait = "0.1"
bytes = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
