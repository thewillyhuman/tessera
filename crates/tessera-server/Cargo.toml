[package]
name = "tessera-server"
description = "Tessera network front ends: HTTP administration, OTLP ingest and dataset reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-catalog.workspace = true
tessera-format.workspace = true
tessera-ingest.workspace = true
tessera-manifest.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
axum = "0.8"
bytes = "1"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
