[package]
name = "tessera-server"
description = "Tessera network front ends: HTTP administration, OTLP ingest and dataset reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-catalog.workspace = true
tessera-cluster.workspace = true
tessera-eval.workspace = true
tessera-exec.workspace = true
tessera-format.workspace = true
tessera-ingest.workspace = true
tessera-manifest.workspace = true
tessera-ir.workspace = true
tessera-kernels.workspace = true
tessera-logql.workspace = true
tessera-object.workspace = true
tessera-opt.workspace = true
tessera-pgcatalog.workspace = true
tessera-promql.workspace = true
tessera-sql.workspace = true
tessera-traceql.workspace = true
tessera-types.workspace = true

arrow = { version = "60", default-features = false }
arrow-ipc = "60"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
form_urlencoded = "1"
futures = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
pgwire = { version = "0.41", default-features = false, features = ["server-api-ring", "pg-type-chrono"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "logs", "metrics", "trace", "with-serde"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["net", "rt", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "gzip", "router", "server"] }
tower-http = { version = "0.6", default-features = false, features = ["decompression-gzip"] }
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
x509-certificate = "0.25"

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
http-body-util = "0.1"
rand = "0.8"
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem"] }
snap = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
