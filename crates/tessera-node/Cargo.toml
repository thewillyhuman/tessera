[package]
name = "tessera-node"
description = "Tessera node: wires the roles, the background work and the APIs of one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-advisor.workspace = true
tessera-catalog.workspace = true
tessera-cluster.workspace = true
tessera-commit.workspace = true
tessera-compact.workspace = true
tessera-eval.workspace = true
tessera-exec.workspace = true
tessera-format.workspace = true
tessera-iceberg.workspace = true
tessera-ingest.workspace = true
tessera-manifest.workspace = true
tessera-object.workspace = true
tessera-server.workspace = true
tessera-types.workspace = true
tessera-ir.workspace = true
tessera-sql.workspace = true
tessera-wal.workspace = true

arrow = { version = "60", default-features = false }
axum = "0.8"
serde_json = "1"
futures = "0.3"
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "service", "tokio"] }
rustls-pki-types = { version = "1", features = ["std"] }
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "logs"] }
rcgen = "0.13"
serde_json = "1"
tonic = { version = "0.14", features = ["gzip"] }
tessera-catalog.workspace = true
tessera-cluster.workspace = true
tessera-manifest.workspace = true
tessera-object.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
ureq = { version = "3", features = ["json"] }

[lints]
workspace = true
