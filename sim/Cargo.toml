[package]
name = "tessera-sim"
description = "Deterministic simulation harness for Tessera's coordination primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-catalog.workspace = true
tessera-commit.workspace = true
tessera-object.workspace = true
tessera-types.workspace = true

clap = { version = "4", features = ["derive"] }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "test-util"] }

[lints]
workspace = true
