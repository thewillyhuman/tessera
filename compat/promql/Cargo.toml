[package]
name = "tessera-compat-promql"
description = "Differential tests of Tessera's PromQL and Prometheus API against a Prometheus instance on identical data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tessera-ingest.workspace = true
tessera-server.workspace = true

axum = "0.8"
prost = "0.14"
serde_json = "1"
snap = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
ureq = { version = "3", default-features = false, features = ["json"] }

[lints]
workspace = true
